openapi: 3.0.3
info:
  title: Arquivo.pt CDX(J) Server API
  version: "1.0.0"
  description: |
    The CDX(J) Server API exposed by [Arquivo.pt](https://arquivo.pt) at `/wayback/cdx`, backed by
    [pywb](https://github.com/webrecorder/pywb)'s CDX(J) Server API. It allows clients to look up,
    filter, and sort captures for a given URL in the Arquivo.pt archive.

    A record in the index describes one capture of a URL at a point in time, plus enough metadata
    (mime type, HTTP status, content digest, and the location of the content in a WARC/CDX file) to
    later retrieve the actual archived resource.

    This specification documents the query endpoint mounted by pywb's front-end app
    (`FrontEndApp.serve_cdx`) and the query semantics implemented in
    `pywb.warcserver.index.query.CDXQuery` / `pywb.warcserver.index.cdxops`, as deployed for the
    `wayback` collection at [arquivo.pt/wayback/cdx](https://arquivo.pt/wayback/cdx?url=publico.pt).

    Arquivo.pt's index is a folder of CDXJ files (not a paginated ZipNum index), so the pagination
    parameters (`page`, `pageSize`, `showNumPages`, `showPagedIndex`) are not currently supported.
  contact:
    name: Arquivo.pt
    url: https://arquivo.pt
  license:
    name: Apache-2.0
    url: https://github.com/webrecorder/pywb/blob/main/LICENSE

servers:
  - url: "https://arquivo.pt"
    description: Arquivo.pt production API

tags:
  - name: CDX
    description: Query the capture index for a collection.

paths:
  "/wayback/cdx":
    get:
      operationId: queryCdx
      tags: [CDX]
      summary: Query the capture index
      description: |
        Look up captures matching `url`, optionally filtered and sorted. Exactly one of the
        supported `output` formats is returned; see the response content types below.
      parameters:
        - $ref: "#/components/parameters/Url"
        - $ref: "#/components/parameters/MatchType"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Closest"
        - $ref: "#/components/parameters/Output"
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/CollapseTime"
        - $ref: "#/components/parameters/ResolveRevisits"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ShowNumPages"
        - $ref: "#/components/parameters/ShowPagedIndex"
      responses:
        "200":
          description: >-
            Matching captures, in the format selected by `output`; see each content type below.
            When nothing matches, the response is still `200`, with an empty body.
          content:
            text/x-cdxj:
              schema:
                type: string
              description: >-
                Default format. One record per line: `{urlkey} {timestamp} {json-fields}`,
                where json-fields is a JSON object of all fields except urlkey/timestamp.
              example: |
                pt,publico)/ 19961013180344 {"status": "200", "url": "http://www.publico.pt/palop/..", "filename": "AWP-Roteiro-20090510220155-00000.arc.gz", "length": "0", "mime": "text/html", "offset": "12355328", "digest": "HKNRKVY3JJIXTMHMYHM3ELU7XCGYMVHM", "collection": "Roteiro", "source": "cdx_folder:Roteiro.cdxj", "source-coll": "cdx_folder"}
            text/x-ndjson:
              schema:
                $ref: "#/components/schemas/CDXRecordsNdjson"
              description: One JSON object per line (`output=json`), newline-delimited.
              example: |
                {"urlkey": "pt,publico)/", "timestamp": "19961013180344", "status": "200", "url": "http://www.publico.pt/palop/..", "filename": "AWP-Roteiro-20090510220155-00000.arc.gz", "length": "0", "mime": "text/html", "offset": "12355328", "digest": "HKNRKVY3JJIXTMHMYHM3ELU7XCGYMVHM", "collection": "Roteiro", "source": "cdx_folder:Roteiro.cdxj", "source-coll": "cdx_folder"}
            text/plain:
              schema:
                type: string
              description: >-
                Space-separated field values (`output=text`), one record per line, in the order
                the fields are stored in each record (see `CDXRecord` for field meanings). Neither
                the order nor the set of fields is fixed — it can differ between records and
                collections (e.g. `warc/revisit` records have no `status`) — so prefer
                `output=json` for parsing.
              example: |
                pt,publico)/ 19961013180344 200 http://www.publico.pt/palop/.. AWP-Roteiro-20090510220155-00000.arc.gz 0 text/html 12355328 HKNRKVY3JJIXTMHMYHM3ELU7XCGYMVHM Roteiro cdx_folder:Roteiro.cdxj cdx_folder
            application/link-format:
              schema:
                type: string
              description: >-
                RFC 7089 Memento TimeMap (`output=link`): one `rel="memento"` entry per capture,
                each with a `collection` attribute.
              example: |
                <http://www.publico.pt/palop/..>; rel="memento"; datetime="Sun, 13 Oct 1996 18:03:44 GMT"; collection="cdx_folder",
                <http://www.publico.pt/>; rel="memento"; datetime="Sun, 13 Oct 1996 18:27:12 GMT"; collection="cdx_folder"
            application/json:
              schema:
                $ref: "#/components/schemas/PageInfo"
              description: >-
                **Not currently supported on Arquivo.pt** (`showNumPages` is ignored and capture
                records are returned instead). Would be returned instead of capture records when
                `showNumPages=true` against a paginated (ZipNum) index: a single JSON object
                summarizing the page count for the query.
        "400":
          description: >-
            Bad request — e.g. missing required `url` param or unsupported `output` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: 'The "url" param is required'
        "503":
          description: The underlying archive/index is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    Url:
      name: url
      in: query
      required: true
      description: >-
        The only required parameter. The URL to look up. A trailing `*` or leading `*.` is
        equivalent to `matchType=prefix`/`matchType=domain` respectively.
      schema:
        type: string
      example: publico.pt

    MatchType:
      name: matchType
      in: query
      required: false
      description: |
        How `url` is matched against the index:
        - `exact` (default) — captures that match the URL exactly.
        - `prefix` — captures whose URL begins with the given path, e.g. `http://sapo.pt/noticias/*`.
        - `host` — captures for the given host, ignoring the path.
        - `domain` — captures for the given host and all subdomains, e.g. `*.example.com`.
      schema:
        type: string
        enum: [exact, prefix, host, domain]

    From:
      name: from
      in: query
      required: false
      description: >-
        Restrict results to captures at or after this timestamp (inclusive). May be fewer than 14
        digits, in which case it is padded down to the start of the given period (e.g. `2014` ->
        `20140101000000`).
      schema:
        type: string
        pattern: '^\d{1,14}$'

    To:
      name: to
      in: query
      required: false
      description: >-
        Restrict results to captures at or before this timestamp (inclusive). May be fewer than 14
        digits, in which case it is padded up to the end of the given period (e.g. `2014` ->
        `20141231235959`).
      schema:
        type: string
        pattern: '^\d{1,14}$'

    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of index lines to return. Must be a positive integer; defaults to 100.
        Values up to 10000 are recommended; 100000 is the maximum allowed value.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 100
      example: 100

    Sort:
      name: sort
      in: query
      required: false
      description: |
        Sort order for results:
        - `reverse` — sort matches in reverse order. Recommended only for `matchType=exact`
          queries, as reversing a large match set may be slow.
        - `closest` — sort by absolute time distance to the `closest` timestamp. Requires
          `closest` to also be set, and is only well-defined for `matchType=exact` queries.
      schema:
        type: string
        enum: [reverse, closest]

    Closest:
      name: closest
      in: query
      required: false
      description: >-
        A 14-digit (or shorter) timestamp to sort results by closeness to, when `sort=closest` (or
        simply when `closest` is set — it implies closest-sort regardless of `sort`).
        Example nearest to 2020-06-01 00:00:00 UTC is `20200601000000`.
      schema:
        type: string
        pattern: '^\d{1,14}$'

    Output:
      name: output
      in: query
      required: false
      description: |
        Response format:
        - `cdxj` — default. `{urlkey} {timestamp} {json}` per line.
        - `json` — one JSON object per line (newline-delimited JSON), recommended for analysis.
        - `text` — space-separated field values, one record per line.
        - `link` — RFC 7089 Memento TimeMap, `application/link-format`.
      schema:
        type: string
        enum: [text, json, cdxj, link]
        default: cdxj

    Filter:
      name: filter
      in: query
      required: false
      description: |
        Filter results on a field. May be repeated; all filters must match (logical AND). Syntax:
        `{fieldname}:[!][=|~]{expression}`.

        This is an array parameter: each item you add becomes its own `filter=` query entry.
        Below, enter just the `{fieldname}:[!][=|~]{expression}` part per item (e.g. `!mime:html`)
        — do not type `filter=` yourself, or it will be sent as `filter=filter=!mime:html`.

        | modifier(s) | value to enter for this parameter | resulting query           | meaning                                            |
        |-------------|------------------------------------|----------------------------|-----------------------------------------------------|
        | (none)      | `mime:html`                         | `filter=mime:html`          | field "mime" contains the string "html"              |
        | `=`         | `=mime:text/html`                   | `filter==mime:text/html`    | field "mime" is exactly "text/html"                  |
        | `~`         | `~mime:.*/html$`                    | `filter=~mime:.*/html$`     | regex matches the beginning of field "mime"          |
        | `!`         | `!mime:html`                        | `filter=!mime:html`         | field "mime" does not contain "html"                 |
        | `!=`        | `!=mime:text/html`                  | `filter=!=mime:text/html`   | field "mime" is not exactly "text/html"              |
        | `!~`        | `!~mime:.*/html`                    | `filter=!~mime:.*/html`     | regex does not match the beginning of field "mime"   |

        If no field name is given (just `{expression}`, with no `:`), the filter is applied to the
        entire raw record.

        Example: entering the array items `=mime:text/html` and `!=status:200` sends
        `filter==mime:text/html&filter=!=status:200`, returning only HTML captures that did not
        return HTTP 200 OK.
      schema:
        type: array
        items:
          type: string
        default: []
      style: form
      explode: true

    Fields:
      name: fields
      in: query
      required: false
      description: >-
        Comma-delimited list of field names to include in the output (all fields are returned if
        omitted). Also accepted under the legacy alias `fl`. Standard fields:
        `urlkey`, `timestamp`, `url`, `mime`, `status`, `digest`, `length`, `offset`, `filename`,
        `collection`, `source`, `source-coll` (plus `orig.length`, `orig.offset`, `orig.filename`
        when `resolveRevisits=true`). The same names can be used in `filter`, e.g.
        `filter=collection:Roteiro`.

        Example: `fields=url,timestamp,status` returns only the URL, timestamp, and HTTP status code for each capture.
      schema:
        type: string

    CollapseTime:
      name: collapseTime
      in: query
      required: false
      description: >-
        Collapse consecutive captures that share the same status code and whose timestamps agree
        on the first N digits (e.g. `collapseTime=10` collapses captures from the same day),
        keeping only the first of each run.
        Could be used to reduce the number of results for a URL that was captured many times in a short period.
      schema:
        type: integer

    ResolveRevisits:
      name: resolveRevisits
      in: query
      required: false
      description: >-
        If true, resolve `revisit` records against the original capture with the same payload
        digest: the revisit's `mime`/`status` are filled in from the original, and
        `orig.length`/`orig.offset`/`orig.filename` are added pointing at the original record's
        location (`-` if not resolvable).
      schema:
        type: boolean

    Page:
      name: page
      in: query
      required: false
      description: >-
        **Not currently supported on Arquivo.pt** (ignored). Zero-based page number to fetch, for
        collections backed by a paginated (ZipNum) secondary index. Used together with `pageSize`.
      schema:
        type: integer
        minimum: 0

    PageSize:
      name: pageSize
      in: query
      required: false
      description: >-
        **Not currently supported on Arquivo.pt** (ignored). Number of index blocks per page, for
        collections backed by a paginated (ZipNum) secondary index. Defaults to the server's
        configured block size.
      schema:
        type: integer

    ShowNumPages:
      name: showNumPages
      in: query
      required: false
      description: >-
        **Not currently supported on Arquivo.pt** (ignored; capture records are returned). If
        true, instead of returning capture records, return a single JSON object describing the
        number of available pages for this query (see `PageInfo`). Only meaningful for
        collections backed by a paginated (ZipNum) secondary index.
      schema:
        type: boolean

    ShowPagedIndex:
      name: showPagedIndex
      in: query
      required: false
      description: >-
        **Not currently supported on Arquivo.pt** (ignored; capture records are returned). If
        true, return raw secondary-index (IDX) entries instead of resolved CDX records —
        `urlkey`, `part`, `offset`, `length`, and optionally `lineno`. Advanced/internal use.
      schema:
        type: boolean

  schemas:
    CDXRecord:
      type: object
      description: >-
        A single capture record. Exact fields present depend on the record and the `fields`
        param.
      properties:
        urlkey:
          type: string
          description: SURT-canonicalized form of `url`, used as the index sort key.
          example: "pt,publico)/"
        timestamp:
          type: string
          description: >-
            Capture timestamp (UTC, `YYYYMMDDhhmmss`). Usually 14 digits; some older records have
            fewer (e.g. `200011091615`).
          example: "20200101120000"
        url:
          type: string
          description: Original captured URL.
          example: "https://publico.pt/"
        mime:
          type: string
          description: Content (MIME) type of the captured resource, or `warc/revisit` for revisit records.
          example: "text/html"
        status:
          type: string
          description: HTTP status code of the capture, as a string. May be missing, e.g. on `warc/revisit` records.
          example: "200"
        digest:
          type: string
          description: Content digest (e.g. SHA-1) of the captured payload, used to detect/resolve revisits.
        length:
          type: string
          description: Length in bytes of the WARC/ARC record.
        offset:
          type: string
          description: Byte offset of the WARC/ARC record within `filename`.
        filename:
          type: string
          description: Name of the WARC/ARC file containing the record.
        collection:
          type: string
          description: Arquivo.pt collection the capture belongs to.
          example: "Roteiro"
        source:
          type: string
          description: Index source the record was read from, as `{source-coll}:{index file}`.
          example: "cdx_folder:Roteiro.cdxj"
        source-coll:
          type: string
          description: Name of the index source (the configured CDXJ folder).
          example: "cdx_folder"
        orig.length:
          type: string
          description: Present when `resolveRevisits=true`. Length of the original (non-revisit) record, or `-`.
        orig.offset:
          type: string
          description: Present when `resolveRevisits=true`. Byte offset of the original record, or `-`.
        orig.filename:
          type: string
          description: Present when `resolveRevisits=true`. Filename of the original record, or `-`.
      required: [urlkey, timestamp, url]

    CDXRecordsNdjson:
      type: string
      description: >-
        Newline-delimited JSON: each line is a `CDXRecord` JSON object. Not a JSON array — parse
        line by line.

    PageInfo:
      type: object
      description: >-
        **Not currently supported on Arquivo.pt**. Page-count summary that would be returned when
        `showNumPages=true` against a paginated (ZipNum) index.
      properties:
        pages:
          type: integer
          description: Total number of pages available for this query.
        pageSize:
          type: integer
          description: Number of index blocks per page (echoes `pageSize`, or the server default).
        blocks:
          type: integer
          description: Total number of index blocks matched by this query.
      required: [pages, pageSize, blocks]

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
        errors:
          type: object
          description: Optional map of additional per-source error details.
          additionalProperties: true
      required: [message]
